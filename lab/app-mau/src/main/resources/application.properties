spring.application.name=app-mau
server.port=8080

# Database. Địa chỉ và mật khẩu đang ghi cứng ở đây, và đó là một chỗ chưa ổn mà khoá học sẽ quay lại sửa.
spring.datasource.url=jdbc:postgresql://localhost:5432/appmau
spring.datasource.username=appmau
spring.datasource.password=matkhau-lab
# Không ai trả lời thì bỏ cuộc sau 3 giây, đừng đợi 30 giây mặc định
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1

# Cho /actuator/health nói rõ phần nào đang hỏng
management.endpoint.health.show-details=always

# Nhận SIGTERM thì xử lý nốt request đang dở rồi mới thoát
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
